name: Build

on:
  push:
    branches: [arena/b5bd2e3f-donut-client-vitraxrevamp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Inspect mapped API (temporary diagnostics)
        if: always()
        run: |
          say() { printf '::error::API %s\n' "${1:0:370}"; }
          bash gradlew --no-daemon -q -I ci-diagnostics.gradle dumpMappedJars > jars.txt 2>&1 || true
          jar=$(grep '^MAPPED ' jars.txt | grep -v sources | head -1 | sed 's/^MAPPED //')
          say "JAR=$jar"; [ -n "$jar" ] || { head -5 jars.txt | while IFS= read -r l; do say "$l"; done; exit 0; }
          one() { javap -classpath "$jar" "$1" 2>&1 | grep -F "$2" | head -2 | tr '\n' '|'; }
          cp=$(find .gradle/loom-cache/minecraftMaven -name "*.jar" 2>/dev/null | grep -v sources | tr '\n' ':')
          # Print every matching line, split into 330-character annotations so nothing is truncated.
          dump() {
            javap -classpath "$cp" "$1" 2>&1 | grep -E "$2" | tr -s ' ' | while IFS= read -r line; do
              echo "$line" | fold -w 330 | while IFS= read -r part; do say "$3 $part"; done
            done
          }
          dump net.minecraft.world.level.chunk.ChunkGenerator 'buildSurface|applyCarvers|fillFromNoise' CG
          dump net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator 'NoiseBasedChunkGenerator\(|buildSurface|applyCarvers|fillFromNoise' NBCG
          dump net.minecraft.world.level.levelgen.SurfaceSystem 'buildSurface' SURSYS
          dump net.minecraft.world.level.levelgen.carver.ConfiguredWorldCarver 'isStartChunk|carve' CARVER
          dump net.minecraft.world.level.levelgen.structure.Structure 'generate\(' STRUCT
          dump net.minecraft.world.level.chunk.PalettedContainerFactory 'PalettedContainerFactory\(|create' PCF
          dump net.minecraft.world.level.chunk.ProtoChunk 'Noise|Carving|Biomes|getSections|getHeight' PC
          dump net.minecraft.world.level.chunk.ChunkAccess 'getOrCreateNoiseChunk|getNoiseChunk|applyCarvers' CA
          dump net.minecraft.world.level.levelgen.WorldGenerationContext 'WorldGenerationContext\(' WGC

      - name: Surface build errors as annotations
        if: failure()
        run: |
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | while IFS= read -r line; do echo "::error::TEST $line"; done
            python3 - "$f" <<'PYEOF' | while IFS= read -r line; do echo "::error::FAILED $line"; done
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case):
                  if bad.tag in ("failure", "error"):
                      print(case.get("classname") + "." + case.get("name") + " :: " + (bad.get("message") or "")[:300])
          PYEOF
          done
          grep -E "error:|FAILURE:|What went wrong|Could not|Execution failed" -A 6 gradle.log | head -80 | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::error::$clean"
          done
          tail -60 gradle.log | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::warning::LOG $clean"
          done
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donut-client
          path: build/libs/*.jar
          if-no-files-found: error
