name: Build

on:
  push:
    branches: [arena/b5bd2e3f-donut-client-vitraxrevamp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Inspect mapped API (temporary diagnostics)
        continue-on-error: true
        run: |
          jar=$(find ~/.gradle/caches -name "*named*.jar" | grep -i minecraft | head -1)
          echo "inspecting $jar"
          if [ -n "$jar" ]; then
            javap -classpath "$jar" net.minecraft.world.level.StructureManager 2>&1 | head -20 | while IFS= read -r line; do echo "::error::API StructureManager $line"; done
            javap -classpath "$jar" net.minecraft.world.level.chunk.ProtoChunk 2>&1 | grep -E "setBlockState|getHeight|fillBiomes|getOrCreateCarvingMask|getOrCreateNoiseChunk" | head -10 | while IFS= read -r line; do echo "::error::API ProtoChunk $line"; done
            javap -classpath "$jar" net.minecraft.world.level.chunk.ChunkAccess 2>&1 | grep -E "fillBiomes|getHeight" | head -10 | while IFS= read -r line; do echo "::error::API ChunkAccess $line"; done
            javap -classpath "$jar" net.minecraft.world.level.levelgen.Heightmap\$Types 2>&1 | head -20 | while IFS= read -r line; do echo "::error::API Heightmap.Types $line"; done
          fi
      - name: Build and run unit tests
        run: |
          set -o pipefail
          bash gradlew build --no-daemon --stacktrace 2>&1 | tee gradle.log
      - name: Inspect mapped API (temporary diagnostics)
        if: always()
        run: |
          say() { echo "::error::API ${1:0:380}"; }
          jar=""
          for candidate in $(find "$HOME/.gradle/caches" "$PWD/.gradle" -name "*.jar" 2>/dev/null | grep -v sources | head -6000); do
            if unzip -l "$candidate" 2>/dev/null | grep -q "net/minecraft/world/level/StructureManager.class"; then jar="$candidate"; break; fi
          done
          say "JAR=$jar"
          [ -n "$jar" ] || exit 0
          dump() { javap -classpath "$jar" "$1" 2>&1 | grep -E "$2" | tr '\n' '|' ; }
          say "SM ctor: $(dump net.minecraft.world.level.StructureManager 'StructureManager(')"
          say "ProtoChunk: $(dump net.minecraft.world.level.chunk.ProtoChunk 'setBlockState|getHeight\(|fillBiomes|CarvingMask|NoiseChunk|getSections|getHeightAccessorForGeneration')"
          say "ChunkAccess: $(dump net.minecraft.world.level.chunk.ChunkAccess 'fillBiomes|getHeight\(|getMinSectionY|getSectionYFrom')"
          say "ChunkGenerator: $(dump net.minecraft.world.level.chunk.ChunkGenerator 'fillFromNoise|buildSurface|getBiomeGenerationSettings|generate\(|createStructures|applyCarvers')"
          say "FeatureSorter: $(dump 'net.minecraft.world.level.biome.FeatureSorter$StepFeatureData' 'features|indexMapping')"
          say "PlacedFeature: $(dump net.minecraft.world.level.levelgen.placement.PlacedFeature 'placeWithBiomeCheck|placement\(')"
          say "Structure: $(dump net.minecraft.world.level.levelgen.structure.Structure 'generate\(|step\(')"
          say "HeightmapTypes: $(dump 'net.minecraft.world.level.levelgen.Heightmap$Types' 'OCEAN_FLOOR_WG|isOpaque|isOpaque')"
          say "PalettedContainerFactory: $(dump net.minecraft.world.level.chunk.PalettedContainerFactory 'PalettedContainerFactory(')"
          say "LevelChunkSection: $(dump net.minecraft.world.level.chunk.LevelChunkSection 'getBiomes|copy\(|maybeHas|getSectionYFrom')"
          say "CarvingContext: $(dump net.minecraft.world.level.levelgen.carver.CarvingContext 'CarvingContext(')"
          say "Carver: $(dump net.minecraft.world.level.levelgen.carver.ConfiguredWorldCarver 'isStartChunk|carve\(')"
          say "StructurePiece: $(dump net.minecraft.world.level.levelgen.structure.StructurePiece 'postProcess')"
      - name: Surface build errors as annotations
        if: failure()
        run: |
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | while IFS= read -r line; do echo "::error::TEST $line"; done
            python3 - "$f" <<'PYEOF' | while IFS= read -r line; do echo "::error::FAILED $line"; done
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case):
                  if bad.tag in ("failure", "error"):
                      print(case.get("classname") + "." + case.get("name") + " :: " + (bad.get("message") or "")[:300])
          PYEOF
          done
          grep -E "error:|FAILURE:|What went wrong|Could not|Execution failed" -A 6 gradle.log | head -80 | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::error::$clean"
          done
          tail -60 gradle.log | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::warning::LOG $clean"
          done
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donut-client
          path: build/libs/*.jar
          if-no-files-found: error
