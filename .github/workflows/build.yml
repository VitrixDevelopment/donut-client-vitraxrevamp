name: Build

on:
  push:
    branches: [arena/dac2741d-donut-client-vitraxrevamp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build and run unit tests
        run: |
          set -o pipefail
          bash gradlew build --no-daemon --stacktrace 2>&1 | tee gradle.log || echo "BUILD_FAILED" >> gradle.log
      - name: Surface build errors as annotations
        if: always()
        run: |
          [ -f gradle.log ] || exit 0
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PYEOF' | while IFS= read -r line; do echo "::error::FAILED $line"; done
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case):
                  if bad.tag in ("failure", "error"):
                      lines = (bad.text or "").splitlines()
                      where = " | ".join(line.strip() for line in lines if ".java:" in line)[:200]
                      print(case.get("classname") + "." + case.get("name") + " :: " + (bad.get("message") or "")[:200] + " @@ " + where)
          PYEOF
          done
          grep -E "error:" gradle.log | sed 's#.*/donut-client-vitraxrevamp/src/#src/#' | head -80 | while IFS= read -r line; do
            echo "::error::COMPILE $line"
          done
          grep -E "What went wrong|Execution failed|FAILURE:" -A 4 gradle.log | head -60 | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::error::BUILD $clean"
          done
      - name: Fail when compilation or tests failed
        if: always()
        run: |
          if grep -q "BUILD_FAILED" gradle.log; then exit 1; fi
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: donut-client
          path: build/libs/*.jar
          if-no-files-found: ignore
