name: Build

on:
  push:
    branches: [arena/b5bd2e3f-donut-client-vitraxrevamp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Inspect mapped API (temporary diagnostics)
        if: always()
        run: |
          say() { printf '::error::API %s\n' "${1:0:370}"; }
          bash gradlew --no-daemon -q -I ci-diagnostics.gradle dumpMappedJars > jars.txt 2>&1 || true
          jar=$(grep '^MAPPED ' jars.txt | grep -v sources | head -1 | sed 's/^MAPPED //')
          say "JAR=$jar"; [ -n "$jar" ] || { head -5 jars.txt | while IFS= read -r l; do say "$l"; done; exit 0; }
          one() { javap -classpath "$jar" "$1" 2>&1 | grep -F "$2" | head -2 | tr '\n' '|'; }
          one net.minecraft.world.level.StructureManager "StructureManager("
          one net.minecraft.world.level.chunk.PalettedContainerFactory "PalettedContainerFactory("
          one net.minecraft.world.level.levelgen.carver.CarvingContext "CarvingContext("
          one net.minecraft.world.level.levelgen.structure.StructurePiece "postProcess"
          one net.minecraft.world.level.chunk.ChunkGenerator "fillFromNoise"
          one net.minecraft.world.level.chunk.ChunkGenerator "buildSurface"
          one net.minecraft.world.level.chunk.ChunkGenerator "getBiomeGenerationSettings"
          one net.minecraft.world.level.chunk.ChunkGenerator "generate("
          one net.minecraft.world.level.levelgen.carver.ConfiguredWorldCarver "isStartChunk"
          one net.minecraft.world.level.levelgen.carver.ConfiguredWorldCarver "carve("
          one net.minecraft.world.level.chunk.ProtoChunk "getHeight"
          one net.minecraft.world.level.chunk.ProtoChunk "fillBiomes"
          one net.minecraft.world.level.chunk.ProtoChunk "getNoiseChunk"
          one net.minecraft.world.level.chunk.ProtoChunk "getHeightAccessorForGeneration"
          one net.minecraft.world.level.chunk.LevelChunkSection "getBiomes"
          one net.minecraft.world.level.chunk.LevelChunkSection "copy("
          one net.minecraft.world.level.chunk.LevelChunkSection "getSectionYFromSectionIndex"
          one net.minecraft.world.level.biome.MultiNoiseBiomeSource "createFromPreset"
          one net.minecraft.world.level.WorldGenLevel "getHeightmapPos"
          one net.minecraft.world.level.levelgen.structure.placement.RandomSpreadStructurePlacement "getPotentialStructureChunk"

      - name: Surface build errors as annotations
        if: failure()
        run: |
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | while IFS= read -r line; do echo "::error::TEST $line"; done
            python3 - "$f" <<'PYEOF' | while IFS= read -r line; do echo "::error::FAILED $line"; done
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case):
                  if bad.tag in ("failure", "error"):
                      print(case.get("classname") + "." + case.get("name") + " :: " + (bad.get("message") or "")[:300])
          PYEOF
          done
          grep -E "error:|FAILURE:|What went wrong|Could not|Execution failed" -A 6 gradle.log | head -80 | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::error::$clean"
          done
          tail -60 gradle.log | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::warning::LOG $clean"
          done
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donut-client
          path: build/libs/*.jar
          if-no-files-found: error
