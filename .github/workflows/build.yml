name: Build

on:
  push:
    branches: [arena/ba72d408-donut-client-vitraxrevamp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build and run unit tests
        run: |
          set -o pipefail
          bash gradlew build --no-daemon --stacktrace 2>&1 | tee gradle.log
      - name: Surface build errors as annotations
        if: failure()
        run: |
          for f in build/test-results/test/*.xml; do
            [ -f "$f" ] || continue
            grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | while IFS= read -r line; do echo "::error::TEST $line"; done
            grep -o '<testcase name="[^"]*"[^>]*>' "$f" | head -5 >/dev/null
            python3 - "$f" <<'PYEOF' | while IFS= read -r line; do echo "::error::FAILED $line"; done
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case):
                  if bad.tag in ("failure", "error"):
                      print(case.get("classname") + "." + case.get("name") + " :: " + (bad.get("message") or "")[:200])
          PYEOF
          done
          grep -E "error:|FAILURE:|What went wrong|Could not|Execution failed" -A 4 gradle.log | head -60 | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::error::$clean"
          done
          tail -40 gradle.log | while IFS= read -r line; do
            clean=$(echo "$line" | tr -cd '[:print:]' | cut -c1-400)
            [ -n "$clean" ] && echo "::warning::LOG $clean"
          done
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: ignore
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donut-client
          path: build/libs/*.jar
          if-no-files-found: error
