# Builds the mod jar for a published release and attaches it to that release.
# Minecraft 1.21.11 requires JDK 21; this replaces the previous JDK 17/publish-to-Packages
# workflow, which could not build the mod and had no Maven repository configured.

name: Release jar

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Build mod jar and run unit tests
        run: bash gradlew build --no-daemon --stacktrace
      - name: Check the jar name matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          ls build/libs/*.jar
          if ! ls "build/libs/donut-client-${version}.jar" >/dev/null 2>&1; then
            echo "::error::release $tag expects build/libs/donut-client-${version}.jar; bump mod_version in gradle.properties"
            exit 1
          fi
      - name: Upload mod jar as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: donut-client
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Attach the jar to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/libs/*.jar
